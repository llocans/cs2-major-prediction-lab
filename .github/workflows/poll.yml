# Liquipedia poller in GitHub's cloud, so results never depend on a laptop being on.
# Logs results, updates ratings, re-simulates, saves round snapshots, advances stages, commits data
# to main. Each check's status goes to the poll-status branch for the site's status bar (no main noise).
#
# GitHub drops many scheduled runs, so the schedule only *starts* a chain: one run polls every 15 min
# for ~5.5 h (.github/poll-loop.sh), then dispatches its successor. The chain runs from 3 days before
# the event's first stage to 1 day after its last, then ends by itself. Long runs are free because
# the repository is public.
name: poll

on:
  schedule:
    # Starters, Nov-Dec. Off the top of the hour, when GitHub drops the most runs. A starter exits in
    # seconds when a chain is already running.
    - cron: "7,27,47 * * 11,12 *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage id to poll (empty = pick by date)"
        required: false
        default: ""
      chain:
        description: "Internal: set by the previous run to continue the chain"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

env:
  EVENT_ID: pgl-major-singapore-2026

jobs:
  # Skips this run if a chain is already running or queued. A successor (chain=true) skips the check,
  # since its predecessor is still finishing.
  gate:
    if: ${{ !inputs.chain }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      busy: ${{ steps.check.outputs.busy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow poll.yml --limit 30 \
            --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
          echo "busy=$busy" >> "$GITHUB_OUTPUT"
          echo "Other active poll runs: $busy"

  poll:
    needs: gate
    if: ${{ always() && (inputs.chain || needs.gate.outputs.busy == '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # Never two chains at once; a successor waits for its predecessor to finish.
    concurrency:
      group: poll
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Poll every 15 minutes
        id: loop
        env:
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
          STAGE: ${{ inputs.stage }}
        run: |
          git config user.name "cs2-lab poller"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Run a copy: each poll resets the checkout to the latest main, which may change the script.
          cp .github/poll-loop.sh "$RUNNER_TEMP/poll-loop.sh"
          bash "$RUNNER_TEMP/poll-loop.sh"

      # Runs even when a poll failed, so one bad check never stops the chain. The successor picks the
      # stage by date: a forced stage is for one run only.
      - name: Start the next run
        if: ${{ always() && steps.loop.outputs.chain == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true
