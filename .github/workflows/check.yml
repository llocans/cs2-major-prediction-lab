# Runs the same checks as `npm run check` (typecheck, lint, tests including the end-to-end flow
# checks), data validation and the site build on every pull request, so nothing merges unchecked.
name: check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Typecheck, lint, tests
        run: npm run check

      - name: Validate data
        run: npm run validate

      - name: Build site
        run: npm run build
